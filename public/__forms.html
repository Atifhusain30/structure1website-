<html>
  <head><title>Forms</title></head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="city" type="text" />
      <input name="service" type="text" />
      <input name="timeline" type="text" />
      <input name="message" type="text" />
      <input name="photo1" type="file" />
      <input name="photo2" type="file" />
      <input name="photo3" type="file" />
      <input name="contactMethod" type="text" />
      <input name="referralSource" type="text" />
      <input name="subject" type="text" />
      <!-- Lead context (src/lib/attribution.ts). Keep in sync with src/lib/lead-payload.ts; tests/unit/lead-payload.test.mjs checks it. -->
      <input name="form_page" type="text" />
      <input name="landing_page" type="text" />
      <input name="referrer_origin" type="text" />
      <input name="offer" type="text" />
      <input name="package" type="text" />
      <input name="size" type="text" />
      <input name="utm_source" type="text" />
      <input name="utm_medium" type="text" />
      <input name="utm_campaign" type="text" />
      <input name="utm_content" type="text" />
      <input name="utm_term" type="text" />
      <input name="gclid" type="text" />
      <input name="fbclid" type="text" />
    </form>
  </body>
</html>
